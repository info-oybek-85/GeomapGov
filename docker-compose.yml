services:
  web:
    build: .
    container_name: geomapgov_web
    command: >
      sh -c "
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "
    env_file:
      - .env
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
      - ./db.sqlite3:/app/db.sqlite3
    expose:
      - '8000'
    restart: unless-stopped

  bot:
    build: .
    container_name: geomapgov_bot
    command: python bot/main.py
    env_file:
      - ./bot/.env
    volumes:
      - ./bot:/app/bot
      - ./db.sqlite3:/app/db.sqlite3
    restart: unless-stopped

  nginx:
    image: nginx:1.24
    container_name: geomapgov_nginx
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/00-tune.conf:/etc/nginx/conf.d/00-tune.conf:ro
      - ./nginx/geomapgov.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/talimyonalishai.conf:/etc/nginx/conf.d/talimyonalishai.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./media:/app/media:ro
    networks:
      - default
      - proxy_net
    restart: unless-stopped

networks:
  proxy_net:
    external: true
