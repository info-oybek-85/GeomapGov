server {
    listen 80;
    server_name fastappeal.uz;
    return 301 https://fastappeal.uz$request_uri;
}

server {
    listen 443 ssl;
    server_name fastappeal.uz;

    ssl_certificate /etc/letsencrypt/live/fastappeal.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fastappeal.uz/privkey.pem;

    client_max_body_size 100M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
