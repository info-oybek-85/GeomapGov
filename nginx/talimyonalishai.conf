server {
    listen 80;
    server_name talimyonalishai.uz;
    return 301 https://talimyonalishai.uz$request_uri;
}

server {
    listen 443 ssl;
    server_name talimyonalishai.uz;

    ssl_certificate     /etc/letsencrypt/live/talimyonalishai.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talimyonalishai.uz/privkey.pem;

    client_max_body_size 200M;

    location / {
        proxy_pass http://talimyo_web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
