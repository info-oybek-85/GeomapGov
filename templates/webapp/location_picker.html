<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Manzilni tanlash</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#fff}#searchBox{position:absolute;z-index:1000;top:10px;left:10px;right:10px;background:#fff;padding:8px;border-radius:12px;box-shadow:0 2px 10px #0003;display:flex;gap:6px}#search{flex:1;border:1px solid #ddd;border-radius:9px;padding:11px;font-size:15px}#searchBtn{border:0;border-radius:9px;padding:0 14px;background:#2481cc;color:#fff;font-weight:700}#results{position:absolute;z-index:1001;top:65px;left:10px;right:10px;max-height:210px;overflow:auto;background:#fff;border-radius:10px;box-shadow:0 2px 10px #0003}.result{padding:10px;border-bottom:1px solid #eee;font-size:14px}#map{position:absolute;top:0;bottom:96px;left:0;right:0}#panel{position:absolute;bottom:0;left:0;right:0;height:96px;padding:10px 14px;box-sizing:border-box;background:#fff;border-top:1px solid #ddd}#address{font-size:13px;color:#555;height:34px;overflow:hidden;text-align:center}#send{width:100%;border:0;border-radius:10px;padding:12px;background:#2481cc;color:#fff;font-size:16px;font-weight:700}#send:disabled{opacity:.5}.locate{position:absolute;z-index:999;right:14px;bottom:110px;width:46px;height:46px;border-radius:50%;border:1px solid #ccc;background:#fff;font-size:20px}</style></head><body>
<div id="searchBox"><input id="search" placeholder="Mahalla, ko‘cha yoki manzil nomini yozing"><button id="searchBtn">Qidirish</button></div><div id="results"></div><div id="map"></div><button class="locate" id="locate">📍</button><div id="panel"><div id="address">Xaritadan nuqtani tanlang</div><button id="send" disabled>✅ Shu manzilni tanlash</button></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand()} const map=L.map('map').setView([41.3111,69.2797],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);let marker,selected;const address=document.getElementById('address'),send=document.getElementById('send'),results=document.getElementById('results');
function choose(lat,lon,label=''){selected={lat:+lat,lon:+lon,label};if(marker)marker.setLatLng([lat,lon]);else marker=L.marker([lat,lon]).addTo(map);map.setView([lat,lon],17);address.textContent=label||`${(+lat).toFixed(6)}, ${(+lon).toFixed(6)}`;send.disabled=false;results.innerHTML=''}
map.on('click',e=>choose(e.latlng.lat,e.latlng.lng));document.getElementById('locate').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>choose(p.coords.latitude,p.coords.longitude,'Joriy joylashuv'),()=>alert('Lokatsiyani aniqlab bo‘lmadi'));
async function searchAddress(){const q=document.getElementById('search').value.trim();if(q.length<3)return;results.innerHTML='<div class="result">Qidirilmoqda...</div>';try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=7&countrycodes=uz&q=${encodeURIComponent(q)}`,{headers:{'Accept-Language':'uz'}});const data=await r.json();results.innerHTML=data.length?'':'<div class="result">Manzil topilmadi</div>';data.forEach(x=>{const d=document.createElement('div');d.className='result';d.textContent=x.display_name;d.onclick=()=>choose(x.lat,x.lon,x.display_name);results.appendChild(d)})}catch(e){results.innerHTML='<div class="result">Qidiruvda xatolik</div>'}}
document.getElementById('searchBtn').onclick=searchAddress;document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')searchAddress()});send.onclick=()=>{if(!selected)return;tg?.sendData(JSON.stringify({lat:+selected.lat.toFixed(6),lon:+selected.lon.toFixed(6),address:selected.label||''}));tg?.close()};
</script></body></html>
